name: Skill Validation

# Kiểm định mọi skill/plugin khi có thay đổi trong plugins/ (hoặc script kiểm định).
# Validate + security-audit skills and plugin manifests on every PR/push.

on:
  pull_request:
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - ".github/workflows/skill-validation.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - ".claude-plugin/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML (chỉ cần cho validate)
        run: pip install pyyaml

      - name: Validate marketplace & plugin manifests
        run: python scripts/validate_marketplace.py

      - name: Validate skill structure
        run: python scripts/validate_skill.py plugins

      - name: Security audit (fail on HIGH)
        run: python scripts/audit_skill.py --fail-on high plugins
